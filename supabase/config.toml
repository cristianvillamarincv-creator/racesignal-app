# Minimal Supabase project config for RaceSignal B.1. Generated by hand (not `supabase init`) —
# run `supabase link --project-ref <your-project-ref>` after creating the project, then
# `supabase db push` and `supabase functions deploy race-discovery` per README.md.

project_id = "racesignal"

[functions.race-discovery]
# search/history must be callable before the athlete has signed in, so JWT verification is off at
# the gateway. The `detail` action validates the caller's JWT explicitly inside the function
# itself (see index.ts) — this is a deliberate, reviewed exception, not an oversight.
verify_jwt = false
